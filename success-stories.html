<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Success Stories | Happy Paws</title><link rel="stylesheet" href="css/style.css"></head><body>

<main><section class="page-intro"><div class="container"><span class="eyebrow">Love finds a way</span><h1>Success stories</h1><p class="lead">These animals found their people. Replace the sample stories in `js/data.js` when you are ready.</p></div></section><section class="section"><div class="container grid-3" id="stories-grid"></div></section></main>
<footer class="footer"><div class="container footer-grid"><div><h3 data-center-name></h3><p data-center-description></p></div><div><h3>Quick links</h3><p><a href="animals.html">Animals</a><br><a href="adoption.html">Adopt Now</a></p></div><div><h3>Contact</h3><p data-center-address></p><p><a data-center-email></a><br><span data-center-phone></span></p></div></div><div class="container footer-bottom">© <span data-year></span> <span data-center-name></span></div></footer><button class="back-top" aria-label="Back to top">↑</button><script src="js/data.js"></script><script src="js/main.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{document.querySelector('#stories-grid').innerHTML=successStories.map(story=>`<article class="card story-card"><img src="${story.image}" alt="${story.name}" onerror="this.onerror=null;this.src='images/placeholder.svg'"><div class="card-body"><h2>${story.name}</h2><p><strong>Before:</strong> ${story.previous}</p><p><strong>Their story:</strong> ${story.story}</p><p><strong>Now:</strong> ${story.current}</p></div></article>`).join('')});</script></body></html>
