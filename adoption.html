<header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">🐾</span><span data-center-name>Happy Paws</span></a><button class="nav-toggle" aria-label="Open menu">☰</button><nav class="nav-links"><a href="index.html">Home</a><a href="animals.html">Animals</a><a href="about.html">About Us</a><a href="success-stories.html">Stories</a><a href="volunteer.html">Volunteer</a><a href="donate.html">Donate</a><a href="contact.html">Contact</a><a class="button active" href="adoption.html">Adopt Now</a></nav></div></header>
<main><section class="page-intro"><div class="container"><span class="eyebrow">Take the first step</span><h1>Adoption application</h1><p class="lead">Tell us a little about yourself and the home you can offer.</p></div></section><section class="section"><div class="container"><form class="form-panel" data-storage-key="adoptionApplications" data-form-endpoint="https://formspree.io/f/xdekowvo"><div class="form-grid"><div class="field"><label for="full-name">Full name</label><input id="full-name" name="fullName" required></div><div class="field"><label for="age">Age</label><input id="age" name="age" type="number" min="18" required></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div><div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" required></div><div class="field full"><label for="address">Address</label><input id="address" name="address" required></div><div class="field"><label for="adoption-animal">Animal you want to adopt</label><select id="adoption-animal" name="animal" required><option value="">Choose an animal</option></select></div><div class="field"><label for="home">Type of home</label><select id="home" name="homeType" required><option value="">Choose one</option><option>House</option><option>Apartment</option><option>Shared home</option><option>Other</option></select></div><div class="field"><label for="pets">Do you currently own pets?</label><select id="pets" name="currentPets" required><option value="">Choose one</option><option>Yes</option><option>No</option></select></div><div class="field"><label for="permission">Permission to keep pets?</label><select id="permission" name="permission" required><option value="">Choose one</option><option>Yes</option><option>No</option></select></div><div class="field full"><label for="why">Why do you want to adopt?</label><textarea id="why" name="reason" required></textarea></div><div class="field full"><label for="care">How will you take care of the animal?</label><textarea id="care" name="carePlan" required></textarea></div></div><label class="check-row"><input type="checkbox" name="agreesToRules" required> I agree to follow the center's adoption rules and provide a safe, caring home.</label><button class="button" type="submit">Submit application</button><div class="success-message">Thank you! Your adoption application has been submitted successfully.</div></form></div></section></main>
